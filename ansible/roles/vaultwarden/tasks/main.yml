---
- name: Instalar dependencias de Docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Añadir clave GPG de Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Añadir repositorio de Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
    state: present

- name: Instalar Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Asegurar que Docker está corriendo
  systemd:
    name: docker
    state: started
    enabled: true

- name: Añadir usuario jiahao al grupo docker
  user:
    name: jiahao
    groups: docker
    append: true

- name: Crear directorio de Vaultwarden
  file:
    path: /opt/vaultwarden
    state: directory
    mode: '0755'

- name: Crear fichero .env de Vaultwarden
  copy:
    dest: /opt/vaultwarden/.env
    mode: '0600'
    content: |
      VAULTWARDEN_DB_PASSWORD={{ vaultwarden_db_password }}

- name: Crear fichero docker-compose de Vaultwarden
  copy:
    dest: /opt/vaultwarden/docker-compose.yml
    content: |
      services:
        vaultwarden:
          image: vaultwarden/server:latest
          container_name: vaultwarden
          restart: always
          ports:
            - "8080:80"
          env_file:
            - .env
          environment:
            - WEBSOCKET_ENABLED=true
            - SIGNUPS_ALLOWED=true
            - DOMAIN=https://jiahaoye-tfg.duckdns.org/vaultwarden
            - DATABASE_URL=postgresql://vaultwarden:${VAULTWARDEN_DB_PASSWORD}@192.168.100.15/vaultwarden
          volumes:
            - /opt/vaultwarden/data:/data

- name: Abrir puerto Vaultwarden en UFW
  ufw:
    rule: allow
    port: "8080"
    proto: tcp

- name: Lanzar Vaultwarden con Docker Compose
  shell: docker compose up -d
  args:
    chdir: /opt/vaultwarden
