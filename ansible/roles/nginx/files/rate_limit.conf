# Zonas de rate limiting (contexto http)
# Gestionado por Ansible - NO editar manualmente

# Zona general: 10MB almacena ~160.000 IPs, 10 peticiones/segundo por IP
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Zona login: más restrictiva, 5 peticiones/minuto por IP
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
