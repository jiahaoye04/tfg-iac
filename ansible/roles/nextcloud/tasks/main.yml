---
- name: Instalar dependencias de Docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Añadir clave GPG de Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Añadir repositorio de Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
    state: present

- name: Instalar Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Asegurar que Docker está corriendo
  systemd:
    name: docker
    state: started
    enabled: true

- name: Añadir usuario jiahao al grupo docker
  user:
    name: jiahao
    groups: docker
    append: true

- name: Crear directorio de Nextcloud
  file:
    path: /opt/nextcloud
    state: directory
    mode: '0755'

# ---------- Disco de datos en HDD (almacenamiento frío) ----------
- name: Comprobar si el disco de datos ya tiene sistema de ficheros
  ansible.builtin.command: "blkid -o value -s TYPE {{ nextcloud_data_device }}"
  register: nc_data_fstype
  failed_when: false
  changed_when: false

- name: Formatear el disco de datos en ext4 (solo si está vacío)
  ansible.builtin.command: "mkfs.ext4 -F {{ nextcloud_data_device }}"
  when: nc_data_fstype.stdout == ""

- name: Obtener el UUID del disco de datos
  ansible.builtin.command: "blkid -o value -s UUID {{ nextcloud_data_device }}"
  register: nc_data_uuid
  changed_when: false

- name: Crear el punto de montaje del disco de datos
  ansible.builtin.file:
    path: "{{ nextcloud_data_mount }}"
    state: directory
    mode: '0755'

- name: Añadir el disco de datos a /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: " {{ nextcloud_data_mount }} "
    line: "UUID={{ nc_data_uuid.stdout }} {{ nextcloud_data_mount }} ext4 defaults,nofail 0 2"
    state: present

- name: Comprobar si el disco de datos ya está montado
  ansible.builtin.command: "mountpoint -q {{ nextcloud_data_mount }}"
  register: nc_data_mounted
  failed_when: false
  changed_when: false

- name: Montar el disco de datos
  ansible.builtin.command: "mount {{ nextcloud_data_mount }}"
  when: nc_data_mounted.rc != 0

# ---------- Configuración de Nextcloud ----------
- name: Crear fichero .env de Nextcloud
  copy:
    dest: /opt/nextcloud/.env
    mode: '0600'
    content: |
      NEXTCLOUD_DB_PASSWORD={{ nextcloud_db_password }}

- name: Crear fichero docker-compose de Nextcloud
  copy:
    dest: /opt/nextcloud/docker-compose.yml
    content: |
      version: '3'
      services:
        nextcloud:
          image: nextcloud:latest
          container_name: nextcloud
          restart: always
          ports:
            - "8080:80"
          environment:
            - POSTGRES_HOST=192.168.100.15
            - POSTGRES_DB=nextcloud
            - POSTGRES_USER=nextcloud
            - POSTGRES_PASSWORD={{ nextcloud_db_password }}
            - NEXTCLOUD_TRUSTED_DOMAINS=192.168.100.13
            - OVERWRITEWEBROOT=/nextcloud
            - OVERWRITEPROTOCOL=https
            - OVERWRITEHOST=jiahaoye-tfg.duckdns.org
          volumes:
            - /opt/nextcloud/data:/var/www/html
            - {{ nextcloud_data_mount }}:/var/www/html/data

- name: Abrir puerto Nextcloud en UFW
  ufw:
    rule: allow
    port: "8080"
    proto: tcp

# ---------- Migración de datos al HDD (solo la primera vez) ----------
- name: Comprobar si el HDD ya contiene datos de Nextcloud (.ocdata)
  ansible.builtin.stat:
    path: "{{ nextcloud_data_mount }}/.ncdata"
  register: nc_hdd_populated

- name: Comprobar si existe data antigua de Nextcloud en el SSD
  ansible.builtin.stat:
    path: /opt/nextcloud/data/data/.ncdata
  register: nc_old_data

- name: Parar Nextcloud antes de migrar (solo si hay datos que migrar)
  command: docker compose down
  args:
    chdir: /opt/nextcloud
  when:
    - not nc_hdd_populated.stat.exists
    - nc_old_data.stat.exists

- name: Migrar ficheros de usuario del SSD al HDD (preservando permisos)
  command: "cp -a /opt/nextcloud/data/data/. {{ nextcloud_data_mount }}/"
  when:
    - not nc_hdd_populated.stat.exists
    - nc_old_data.stat.exists

- name: Asegurar propietario www-data (UID 33) en el disco de datos
  ansible.builtin.file:
    path: "{{ nextcloud_data_mount }}"
    owner: "33"
    group: "33"
    recurse: true

- name: Recrear contenedor Nextcloud con la nueva configuración
  shell: docker compose up -d
  args:
    chdir: /opt/nextcloud

- name: Añadir dominio de confianza a Nextcloud
  shell: |
    docker exec nextcloud php occ config:system:set trusted_domains 1 --value=jiahaoye-tfg.duckdns.org
  args:
    chdir: /opt/nextcloud
