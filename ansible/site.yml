---
- name: Configuración base de todas las VMs
  hosts: all
  become: true
  roles:
    - base

- name: Configuración de Nextcloud
  hosts: nextcloud
  become: true
  roles:
    - nextcloud

- name: Configuración de Vaultwarden
  hosts: vaultwarden
  become: true
  roles:
    - vaultwarden

- name: Configuración de PostgreSQL
  hosts: postgresql
  become: true
  roles:
    - disk_resize
    - postgresql
    - postgresql_backup

- name: Configuración de Nginx
  hosts: nginx
  become: true
  roles:
    - nginx

- name: Configuración de WireGuard
  hosts: wireguard
  become: true
  roles:
    - wireguard

- name: Configuración de Homer
  hosts: homer
  become: true
  roles:
    - homer
